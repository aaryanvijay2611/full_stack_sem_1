<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Lists</title>
</head>
<body>
    <ul>
        <li>1. hm</li>
        <li>2. hmm</li>
        <li>3. hmmm</li>
    </ul>
    <ol>
        <li>hm</li>
        <li>hmm</li>
        <li>hmmm</li>
    </ol>
        <ol>
           <li><ul>
                <li>hm</li>
                <li>hmm</li>
                <li>hmmm</li>
            </ul></li>
        </ol>
    <ul>
        <li><h2>helloooo</h2>
            <ol>
                <li><h3>helloooo</h3></li>

            </ol>
        </li>
    </ul>
</body>
</html>
